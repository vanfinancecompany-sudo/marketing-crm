<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Live Chat</title>
  <style>html,body{margin:0;width:100%;height:100%;background:transparent}body{overflow:hidden}</style>
</head>
<body>
  <vfc-ai-assistant></vfc-ai-assistant>
  <script type="module">
    import { WIDGET_CHANNEL, createWidgetReadyHandshake } from "./widget-core.mjs";

    const widget = document.querySelector("vfc-ai-assistant");
    const params = new URLSearchParams(window.location.search);
    if (params.get("mode") === "panel") widget.setAttribute("panel-only", "");

    const postToParent = (message) => window.parent.postMessage(message, "*");
    const handshake = createWidgetReadyHandshake({ announce: postToParent });

    widget.addEventListener("vfc-ai-request", (event) => {
      if (event.detail?.channel === WIDGET_CHANNEL) postToParent(event.detail);
    });
    widget.addEventListener("vfc-ai-ui", (event) => {
      if (event.detail?.channel === WIDGET_CHANNEL) postToParent(event.detail);
    });
    window.addEventListener("message", (event) => {
      if (event.data?.channel !== WIDGET_CHANNEL) return;
      if (event.data.type === "initialise") handshake.acknowledge();
      widget.receive(event.data);
    });

    await import("./widget.mjs");
    handshake.start();
  </script>
</body>
</html>
