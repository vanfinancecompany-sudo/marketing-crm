name: Verify AI Visibility unchecked counts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/ai-visibility-layout-pagination
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture focused test result
        continue-on-error: true
        run: node --test tests/ai-visibility-unchecked-counts.test.js > unchecked-final-test.txt 2>&1
      - name: Capture production build result
        continue-on-error: true
        run: npm run build > unchecked-final-build.txt 2>&1
      - name: Commit diagnostics
        run: |
          rm .github/workflows/verify-ai-visibility-unchecked-counts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix unchecked article counts in AI Visibility"
          git push origin HEAD:ui/ai-visibility-layout-pagination
