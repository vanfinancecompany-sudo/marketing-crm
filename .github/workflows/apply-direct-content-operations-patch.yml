import assert from "node:assert/strict";
import { readFile } from "node:fs/promises";
import {
  createYouTubeExportOperationId,
  recordYouTubeGeneratorDownload,
  youtubeActivityTypeForProduct,
} from "../services/marketingDailyOperations.js";

const read = (path) => readFile(new URL(path, import.meta.url), "utf8");

test("global browser anchor interception is completely removed", async () => {
  const service = await read("../services/marketingDailyOperations.js");
  assert.doesNotMatch(service, /HTMLAnchorElement\.prototype\.click/);
  assert.doesNotMatch(service, /document\.querySelector\("\.youtube-generator"\)/);
  assert.doesNotMatch(service, /pageText|originalClick|trackedDownloadClick/);
});

test("YouTube Generator directly connects all four successful video paths", async () => {
  const page = await read("../pages/YouTubeGeneratorPage.jsx");
  assert.match(page, /handleDownloadMp4[\s\S]*trackCompletedDownload\([\s\S]*format: "mp4"[\s\S]*queueDownload: false/);
  assert.match(page, /handleDownloadWebm[\s\S]*trackCompletedDownload\([\s\S]*format: "webm"[\s\S]*queueDownload: false/);
  assert.match(page, /exportQueuedVehicle[\s\S]*format: "mp4"[\s\S]*queueDownload: true/);
  assert.match(page, /exportQueuedVehicle[\s\S]*format: "webm"[\s\S]*queueDownload: true/);
});

test("structured vehicle ID, registration and queue status are supplied directly", async () => {
  const service = await read("../services/marketingDailyOperations.js");
  const page = await read("../pages/YouTubeGeneratorPage.jsx");
  assert.match(service, /vehicle_id: vehicleId/);
  assert.match(service, /registration,/);
  assert.match(service, /queue_download: Boolean\(queueDownload\)/);
  assert.match(page, /vehicle: selectedVehicle/);
  assert.match(page, /vehicle,/);
  assert.doesNotMatch(`${service}\n${page}`, /page\.textContent|queue_download:.*includes|querySelector\("\.youtube-generator"\)/);
});

test("operation ID is created before download and reused by the success callback", async () => {
  const page = await read("../pages/YouTubeGeneratorPage.jsx");
  const service = await read("../services/marketingDailyOperations.js");
  assert.match(page, /const operationId = createYouTubeExportOperationId\(\);[\s\S]*downloadYouTubeMp4FromServer[\s\S]*operationId/);
  assert.match(service, /sourceId: `youtube-export:\$\{productKey\}:\$\{operationId\}`/);
  assert.doesNotMatch(service, /blob:|href|createObjectURL/);
  assert.notEqual(createYouTubeExportOperationId(), createYouTubeExportOperationId());
});

test("product mapping excludes Cars and non-video exports", () => {
  assert.equal(youtubeActivityTypeForProduct("vanFinance"), "van_finance_reel");
  assert.equal(youtubeActivityTypeForProduct("rent2buy"), "rent2buy_reel");
  assert.equal(youtubeActivityTypeForProduct("cars"), null);
});

test("tracking failure is caught after download and does not enter download failure handling", async () => {
  const page = await read("../pages/YouTubeGeneratorPage.jsx");
  assert.match(page, /YOUTUBE CONTENT OPERATIONS TRACKING ERROR/);
  assert.match(page, /Video downloaded, but Content Operations could not be updated\./);
  assert.match(page, /downloadYouTubeMp4FromServer[\s\S]*await trackCompletedDownload/);
});

test("Knowledge Hub card uses first-Wix-draft wording", async () => {
  const dashboard = await read("../pages/DashboardPage.jsx");
  assert.match(dashboard, /knowledge_hub_article: "sent to Wix"/);
  assert.doesNotMatch(dashboard, /knowledge_hub_article: "published"/);
});

test("Knowledge Hub activity still records only the first successful Wix draft creation", async () => {
  const api = await read("../api/marketing-wix-publishing.js");
  assert.match(api, /result\.operation!=="created"\|\|clean\(article\.wix_item_id\)/);
  assert.match(api, /activity_type:"knowledge_hub_article"/);
  assert.match(api, /source:"knowledge_hub_wix_draft"/);
  assert.match(api, /source_id:article\.id/);
  assert.match(api, /created_or_updated:"created"/);
});

test("migration remains required and safely defaults existing rows", async () => {
  const migration = await read("../supabase/migrations/016_content_operations_knowledge_hub.sql");
  assert.match(migration, /marketing_daily_target_schedules[\s\S]*knowledge_hub_article integer not null default 2/);
  assert.match(migration, /marketing_daily_target_overrides[\s\S]*knowledge_hub_article integer not null default 2/);
  assert.match(migration, /marketing_daily_activity_events_activity_type_check/);
});

test("Wix success remains non-live and tracking failures are non-blocking", async () => {
  const api = await read("../api/marketing-wix-publishing.js");
  const wixLib = await read("../lib/wixPublishing.js");
  assert.match(api, /contentOperationsWarning="Wix draft created, but Content Operations could not be updated\."/);
  assert.match(api, /published:false/);
  assert.doesNotMatch(`${api}\n${wixLib}`, /publishLive|livePublish|status:\s*["']published["']/);
});
