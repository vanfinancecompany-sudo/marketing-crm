    branches:
      - fix/content-operations-reel-knowledge-wiring
    paths:
      - .github/workflows/apply-direct-content-operations-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/content-operations-reel-knowledge-wiring
          fetch-depth: 0

      - name: Apply direct wiring
