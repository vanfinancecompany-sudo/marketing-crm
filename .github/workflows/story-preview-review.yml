name: Story preview review
on:
  push:
    branches: [codex/branded-story-previews]
  pull_request:
    paths:
      - 'tools/story-previews/**'
      - 'tests/story-advert-preview.test.mjs'
      - '.github/workflows/story-preview-review.yml'
permissions:
  contents: read
concurrency:
  group: story-preview-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/story-previews/review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: branded-story-previews
          path: story-preview-output/
          if-no-files-found: error
          retention-days: 30
