name: Story preview review
on:
  pull_request:
    paths:
      - 'tools/story-previews/**'
      - 'tests/story-advert-preview.test.mjs'
      - '.github/workflows/story-preview-review.yml'
permissions:
  contents: read
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test templates and existing pricing / publishing safeguards
        run: node --test tests/story-advert-preview.test.mjs tests/rent2buy-flexible-pricing.test.mjs tests/buffer-full-automation.test.js tests/buffer-instagram-mirror.test.js tests/buffer-recovery-and-story-safety-20261011.test.js tests/vansco-facebook-automation.test.js tests/vansco-instagram-automation.test.js
      - name: Render matched VFC and Rent2Buy previews with approved Vansco reference
        run: node tools/story-previews/review.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matched-brand-story-previews
          path: story-preview-output/
          if-no-files-found: error
          retention-days: 30
