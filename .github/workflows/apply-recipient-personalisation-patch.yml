name: Apply recipient personalisation patch

on:
  push:
    branches: [fix/recipient-first-name-personalisation]
    paths:
      - docs/recipient-personalisation-trigger.txt
      - .github/workflows/apply-recipient-personalisation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recipient-first-name-personalisation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch renderer and sending flow
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, pattern, replacement, label):
            updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
            if count == 0 and replacement.strip() not in text:
              raise SystemExit(f"patch target not found: {label}")
            return updated

          renderer = Path("lib/marketingCampaignTemplateRenderer.js")
          text = renderer.read_text()
          text = replace_once(
            text,
            r'function sampleData\(values = \{\}\) \{\n\s*return \{\n\s*campaign_name: values\.campaign_name \|\| "July New Stock",\n\s*first_name: "Alex",\n\s*company: values\.company_name \|\| "Van Finance Company",\n\s*vehicle_count: "3",\n\s*vehicle_grid: "\[Vehicle grid preview\]",\n\s*\};\n\}',
            '''function sampleData(values = {}) {
  return {
    campaign_name: cleanText(values.campaign_name || "July New Stock", 300),
    first_name: cleanText(values.first_name || "there", 200),
    company: cleanText(values.company || values.company_name || "Van Finance Company", 300),
    vehicle_count: cleanText(values.vehicle_count || "3", 20),
    vehicle_grid: cleanText(values.vehicle_grid || "[Vehicle grid preview]", 500),
  };
}''',
            "sampleData",
          )
          renderer.write_text(text)

          sends = Path("api/marketing-template-campaign-sends.js")
          text = sends.read_text()
          text = replace_once(
            text,
            r'  CampaignValidationError,\n\s*cleanText,\n\s*renderCampaignPreview,',
            '''  CampaignValidationError,
  assertProductionPersonalization,
  cleanText,
  renderRecipientCampaignPreview,''',
            "renderer imports",
          )
          text = replace_once(
            text,
            r'  const preview = renderCampaignPreview\(campaign\);',
            '''  const preview = renderRecipientCampaignPreview(
    campaign,
    options.values || {},
    { mode: options.mode || (options.test ? "test" : "recipient") },
  );''',
            "renderFrozenCampaign preview",
          )
          text = replace_once(
            text,
            r'    html,\n\s*html_hash: hashValue\(`\$\{subject\}\\n\$\{html\}`\),\n\s*\};',
            '''    html,
    html_hash: hashValue(`${subject}\\n${html}`),
    personalization: preview.personalization,
  };''',
            "renderFrozenCampaign metadata",
          )
          text = replace_once(
            text,
            r'          first_name: row\.first_name \|\| "",\n\s*last_name: row\.last_name \|\| "",\n\s*\}\);',
            '''          first_name: String(row.first_name || "").trim(),
          last_name: String(row.last_name || "").trim(),
          company: String(row.company || "").trim(),
        });''',
            "recipient fields",
          )
          text = replace_once(
            text,
            r'  const selectedProvider = activeEmailProvider\(\);\n\s*const rendered = renderFrozenCampaign\(campaign, \{ test: true \}\);',
            '''  const selectedProvider = activeEmailProvider();
  const testFirstName = cleanText(body.test_first_name || body.testFirstName || "Stuart", 200) || "Stuart";
  const rendered = renderFrozenCampaign(campaign, {
    test: true,
    mode: "test",
    values: {
      first_name: testFirstName,
      last_name: cleanText(body.test_last_name || body.testLastName || "", 200),
      company: cleanText(body.test_company || body.testCompany || "Van Finance Company", 300),
      customer_id: "TEST",
      campaign_name: campaign.name,
    },
  });
  assertProductionPersonalization(rendered);''',
            "test personalisation",
          )
          text = replace_once(
            text,
            r'metadata: \{ test_recipient_domain: recipientEmail\.split\("@"\)\[1\] \|\| "", email_provider: selectedProvider \}',
            'metadata: { test_recipient_domain: recipientEmail.split("@")[1] || "", test_first_name: testFirstName, email_provider: selectedProvider }',
            "test audit metadata",
          )
          text = replace_once(
            text,
            r'  const renderedBase = renderFrozenCampaign\(campaign, \{ test: false, unsubscribeUrl: "\{\{unsubscribe_url\}\}" \}\);\n',
            '',
            "shared production render",
          )
          text = replace_once(
            text,
            r'      const unsubscribeUrl = publicUnsubscribeUrl\(unsubscribePayload\(\{ customerId: recipient\.customer_id, email: recipient\.email, campaignId: campaign\.id, sendId: send\.id, recipientId: recipientRecord\.id \}\)\);\n\s*const html = renderedBase\.html\.replace\("\{\{unsubscribe_url\}\}", unsubscribeUrl\);\n\s*const provider = await callEmailProvider\(\{\n\s*to: recipient\.email,\n\s*name: recipient\.name,\n\s*subject: renderedBase\.subject,\n\s*html,',
            '''      const unsubscribeUrl = publicUnsubscribeUrl(unsubscribePayload({ customerId: recipient.customer_id, email: recipient.email, campaignId: campaign.id, sendId: send.id, recipientId: recipientRecord.id }));
      const rendered = renderFrozenCampaign(campaign, {
        test: false,
        mode: "recipient",
        unsubscribeUrl,
        values: {
          first_name: recipient.first_name,
          last_name: recipient.last_name,
          company: recipient.company,
          customer_id: recipient.customer_id,
          campaign_name: campaign.name,
        },
      });
      assertProductionPersonalization(rendered);
      const provider = await callEmailProvider({
        to: recipient.email,
        name: recipient.name,
        subject: rendered.subject,
        html: rendered.html,''',
            "per-recipient production render",
          )
          sends.write_text(text)
      - name: Run focused tests
        run: node --test tests/marketing-recipient-personalisation.test.js
      - name: Run complete test suite
        run: npm test -- --runInBand
      - name: Remove temporary patch workflow and trigger
        run: |
          rm -f .github/workflows/apply-recipient-personalisation-patch.yml
          rm -f .github/workflows/apply-recipient-personalisation.yml
          rm -f docs/recipient-personalisation-trigger.txt
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Personalise campaign sends per recipient"
          git push origin HEAD:fix/recipient-first-name-personalisation
