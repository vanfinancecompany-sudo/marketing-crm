name: Run direct Content Operations wiring patch

on:
  push:
    branches:
      - fix/content-operations-reel-knowledge-wiring
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/content-operations-reel-knowledge-wiring' || github.ref_name == 'fix/content-operations-reel-knowledge-wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/content-operations-reel-knowledge-wiring
          fetch-depth: 0

      - name: Execute patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import traceback

          try:
              workflow = Path('.github/workflows/apply-direct-content-operations-patch.yml').read_text(encoding='utf-8')
              start_marker = '      - name: Apply direct wiring\n        shell: python\n        run: |\n'
              end_marker = '\n      - name: Commit direct wiring\n'
              script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
              lines = script.splitlines()
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
              exec(compile(script, 'direct-content-operations-patch', 'exec'))
              Path('.github/workflows/run-direct-content-operations-patch.yml').unlink(missing_ok=True)
          except Exception:
              Path('patch-error.txt').write_text(traceback.format_exc(), encoding='utf-8')
          except SystemExit as error:
              Path('patch-error.txt').write_text(f'SystemExit: {error}\n', encoding='utf-8')
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use direct download tracking for Content Operations"
          git push origin HEAD:fix/content-operations-reel-knowledge-wiring
