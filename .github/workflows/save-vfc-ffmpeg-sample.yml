name: Save VFC FFmpeg sample MP4
on:
  push:
    branches:
      - samples/vfc-ffmpeg-download-20261019

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip demo capture]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out non-production sample branch
        uses: actions/checkout@v4
      - name: Download generated VFC demonstration video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p samples/videos
          curl --fail --location --retry 3 --retry-delay 2 --max-time 90 \
            "https://sb-5m2by50hxp5p.vercel.run/vfc_ffmpeg_clean_sample.mp4" \
            --output samples/videos/vfc_ffmpeg_clean_sample.mp4
          test "$(stat -c '%s' samples/videos/vfc_ffmpeg_clean_sample.mp4)" -gt 1000000
          file samples/videos/vfc_ffmpeg_clean_sample.mp4 | grep -i 'mp4'
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 samples/videos/vfc_ffmpeg_clean_sample.mp4
      - name: Keep permanent copy on this sample branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/videos/vfc_ffmpeg_clean_sample.mp4
          git commit -m "Add downloadable VFC FFmpeg preview [skip demo capture]"
          git push origin HEAD:samples/vfc-ffmpeg-download-20261019
