name: Finalize Wix live URL resolution

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/finalize-wix-live-url-resolution.yml
      - scripts/finalize_wix_live_url_resolution.py
      - lib/aiVisibilityLiveConnections.js

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-visibility-wix-gsc
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply fixes
        run: python scripts/finalize_wix_live_url_resolution.py
      - name: Format changed files
        run: npx --yes prettier@3.3.3 --write lib/aiVisibilityLiveConnections.js api/marketing-ai-visibility-connections.js components/AIVisibilityLiveConnections.jsx pages/AIVisibilityPage.jsx tests/ai-visibility-live-connections.test.js
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: node --test tests/ai-visibility-live-connections.test.js
      - name: Run production build
        run: npm run build
      - name: Commit verified changes
        run: |
          rm .github/workflows/finalize-wix-live-url-resolution.yml
          rm scripts/finalize_wix_live_url_resolution.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve Wix live article URLs for AI Visibility"
          git push origin HEAD:feature/ai-visibility-wix-gsc
