name: Diagnose AI Visibility live connection tests

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/finalize-ai-visibility-connections.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-visibility-wix-gsc
      - name: Run focused test
        run: node --test tests/ai-visibility-live-connections.test.js
