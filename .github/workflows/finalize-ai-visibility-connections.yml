name: Verify AI Visibility live connections

on:
  pull_request:
    branches:
      - main
    paths:
      - lib/aiVisibility.js
      - lib/aiVisibilityProviders.js
      - lib/aiVisibilityLiveConnections.js
      - api/marketing-ai-visibility-connections.js
      - services/aiVisibility.js
      - components/AIVisibilityLiveConnections.jsx
      - pages/AIVisibilityPage.jsx
      - tests/ai-visibility-live-connections.test.js
      - .github/workflows/finalize-ai-visibility-connections.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: node --test tests/ai-visibility.test.js tests/ai-visibility-live-connections.test.js
      - name: Run production build
        run: npm run build
