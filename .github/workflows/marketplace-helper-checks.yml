name: Marketplace Helper Checks

on:
  pull_request:
    paths:
      - "pages/PostingDeskPage.jsx"
      - "pages/FacebookGroupsAgentPage.jsx"
      - "services/marketplaceAutomation.js"
      - "services/facebookGroupsAgent.js"
      - "browser-extension/marketplace-helper/**"
      - "tests/marketplace-helper.test.js"
      - "tests/facebook-groups-agent.test.js"
      - ".github/workflows/marketplace-helper-checks.yml"

permissions:
  contents: read

jobs:
  marketplace-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Facebook helper tests
        run: node --test tests/marketplace-helper.test.js tests/facebook-groups-agent.test.js

      - name: Run production build
        run: npm run build
