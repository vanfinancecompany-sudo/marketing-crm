name: Marketplace Helper Checks

on:
  pull_request:
    paths:
      - "pages/PostingDeskPage.jsx"
      - "pages/FacebookGroupsAgentPage.jsx"
      - "services/marketplaceAutomation.js"
      - "services/facebookGroupsAgent.js"
      - "browser-extension/marketplace-helper/**"
      - "tests/marketplace-helper.test.js"
      - "tests/facebook-groups-agent.test.js"
      - "tests/marketplace-helper-package.test.js"
      - "scripts/package-marketplace-helper.mjs"
      - "scripts/validate-marketplace-helper.mjs"
      - "scripts/build-application.mjs"
      - "package.json"
      - ".github/workflows/marketplace-helper-checks.yml"

permissions:
  contents: read

jobs:
  marketplace-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Chrome extension manifest and scripts
        run: npm run check:marketplace-helper

      - name: Build and validate extension-only package
        run: npm run package:marketplace-helper -- --out-dir .artifacts/marketplace-helper

      - name: Run Facebook helper tests
        run: node --test tests/marketplace-helper.test.js tests/facebook-groups-agent.test.js tests/marketplace-helper-package.test.js

      - name: Run non-mutating production application build
        run: npm run build:application

      - name: Upload validated Facebook Helper package
        uses: actions/upload-artifact@v4
        with:
          name: vfc-facebook-helper
          path: .artifacts/marketplace-helper/*
          if-no-files-found: error
          retention-days: 14
