name: Preserve genuine AI VFC video test
on:
  push:
    branches:
      - samples/vfc-wan22-ai-motion-test-20261019
permissions:
  contents: write
jobs:
  save-demo:
    if: ${{ !contains(github.event.head_commit.message, '[wan demo saved]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Wan 2.2 14B output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p samples/videos
          curl -fLsS --retry 3 --retry-delay 3 --max-time 120 \
            "https://r3gm-wan2-2-fp8da-aoti-preview2.hf.space/gradio_api/file=/tmp/gradio/cd15eb8ebf04a98ea3ae55899e27a0eae5e93b2103a9cd34eb8216d6902c1923/tmpkc5oyxw_.mp4" \
            --output samples/videos/VFC_Wan22_Real_AI_Motion_Test.mp4
          test "$(stat -c '%s' samples/videos/VFC_Wan22_Real_AI_Motion_Test.mp4)" -gt 1000000
          file samples/videos/VFC_Wan22_Real_AI_Motion_Test.mp4 | grep -i MP4
          echo "Video size: $(stat -c '%s' samples/videos/VFC_Wan22_Real_AI_Motion_Test.mp4)"
      - name: Keep completed experiment in non-production branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/videos/VFC_Wan22_Real_AI_Motion_Test.mp4
          git commit -m "Save actual Wan 2.2 AI-generated vehicle video [wan demo saved]"
          git push origin HEAD:samples/vfc-wan22-ai-motion-test-20261019
