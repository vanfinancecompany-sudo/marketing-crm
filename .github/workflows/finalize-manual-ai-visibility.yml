name: Finalize manual AI visibility workflow

on:
  push:
    branches:
      - feature/ai-visibility-wix-gsc
    paths:
      - .github/workflows/finalize-manual-ai-visibility.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-visibility-wix-gsc
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply manual workflow changes
        run: python scripts/finalize_manual_ai_visibility.py
      - name: Format changed files
        run: npx --yes prettier@3.3.3 --write lib/aiVisibility.js lib/aiVisibilityProviders.js api/marketing-ai-visibility.js components/AIVisibilityLiveConnections.jsx pages/AIVisibilityPage.jsx tests/ai-visibility-manual-workflow.test.js
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: node --test tests/ai-visibility.test.js tests/ai-visibility-live-connections.test.js tests/ai-visibility-manual-workflow.test.js
      - name: Run production build
        run: npm run build
      - name: Commit verified changes
        run: |
          rm .github/workflows/finalize-manual-ai-visibility.yml
          rm scripts/finalize_manual_ai_visibility.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add manual AI visibility evidence workflow"
          git push origin HEAD:feature/ai-visibility-wix-gsc
