name: DealerKit Stock Watch Wix controls stack

on:
  pull_request:
    paths:
      - 'api/finance-missing-dealerkit-wix-stock.js'
      - 'services/financeReservedWixStock.js'
      - 'scripts/apply-dealerkit-missing-wix*.mjs'
      - 'scripts/apply-finance-reserved-wix-stock-watch.mjs'
      - 'scripts/apply-photo-ready-live-wix-counts.mjs'
      - 'tests/dealerkit-reservation-final-safety-post-transform.test.js'
      - '.github/workflows/dealerkit-stock-watch-wix-controls-stack.yml'

permissions:
  contents: read

jobs:
  stock-watch-wix-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and run Stock Watch safety regressions from clean checkout
        run: npm run build
