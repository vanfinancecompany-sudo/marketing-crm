name: Apply canonical model routing patch

on:
  push:
    branches:
      - agent/canonical-model-routing

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[model-routing-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-model-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/apply-model-routing-patch.mjs
      - name: Remove temporary patch machinery
        run: rm scripts/apply-model-routing-patch.mjs .github/workflows/apply-model-routing.yml
      - name: Commit routed implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire canonical model routing [model-routing-applied]"
          git push origin HEAD:agent/canonical-model-routing
