name: Rent2Buy proof relay check

on:
  push:
    branches: [fix/rent2buy-proof-email-relay]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --test tests/rent2buy-proof-email.test.js
      - run: npm run build
