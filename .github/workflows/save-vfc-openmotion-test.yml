name: Store isolated VFC OpenMotion template sample
on:
  push:
    branches:
      - samples/vfc-openmotion-short-test-20261019
permissions:
  contents: write
jobs:
  save:
    if: ${{ !contains(github.event.head_commit.message, '[openmotion saved]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download completed test MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p samples/videos
          curl --fail --location --retry 3 --retry-delay 3 --max-time 110 \
            "https://sb-4bgcm0uynclb.vercel.run/vfc_openmotion_trial.mp4" \
            --output samples/videos/vfc_openmotion_short_test.mp4
          test "$(stat -c '%s' samples/videos/vfc_openmotion_short_test.mp4)" -gt 1000000
          file samples/videos/vfc_openmotion_short_test.mp4 | grep -i MP4
      - name: Commit only to isolated samples branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/videos/vfc_openmotion_short_test.mp4
          git commit -m "Save standalone OpenMotion VFC template test [openmotion saved]"
          git push origin HEAD:samples/vfc-openmotion-short-test-20261019
