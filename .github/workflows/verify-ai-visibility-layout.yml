name: Verify AI Visibility layout

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-ai-visibility-layout.yml
      - tests/ai-visibility-layout-pagination.test.js

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/ai-visibility-layout-pagination
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture focused layout test output
        run: |
          set +e
          node --test tests/ai-visibility-layout-pagination.test.js > ai-layout-test-output.txt 2>&1
          echo $? > ai-layout-test-exit.txt
          set -e
      - name: Run production build
        run: npm run build
      - name: Commit verification output
        run: |
          rm .github/workflows/verify-ai-visibility-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorder AI Visibility and paginate article results"
          git push origin HEAD:ui/ai-visibility-layout-pagination
