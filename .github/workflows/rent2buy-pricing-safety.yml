name: Rent2Buy Pricing Safety
on:
  pull_request:
    paths:
      - "lib/rent2Buy*.mjs"
      - "lib/dealerKitRent2BuyWixPlan.js"
      - "api/_rent2buy-*.js"
      - "api/_rent2buy-*.mjs"
      - "api/rent2buy-*.js"
      - "api/dealerkit-published-price.js"
      - "api/dealerkit-controlled-publish.js"
      - "api/_rent2buy-protected-price-write.mjs"
      - "api/dealerkit-rent2buy-special-deal.js"
      - "api/transactional-rent2buy-application.js"
      - "api/dealerkit-stock-watch-session.js"
      - "api/stock-watch-monitor-agent.js"
      - "utils/rent2BuySpecialDealEditor.js"
      - "utils/dealerKitReviewWorkspace.js"
      - "utils/vanscoWixPriceHelper.js"
      - "styles/dealerkit-review-workspace.css"
      - "docs/sql/rent2buy_*"
      - "tests/rent2buy-*.test.mjs"
      - "vercel.json"
      - ".github/workflows/rent2buy-pricing-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  price-matrix-and-overrides:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node runtime
        run: node --version
      - name: Install pinned dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test ALL Rent2Buy pricing, stock and quote integration safeguards
        run: node --test tests/rent2buy-*.test.mjs
