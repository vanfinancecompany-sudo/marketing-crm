name: DealerKit Wix safety

on:
  pull_request:
    paths:
      - 'lib/dealerKitWix*.js'
      - 'api/dealerkit-wix*.js'
      - 'utils/dealerKitWix*.js'
      - 'tests/dealerkit-wix*.test.js'
      - 'scripts/apply-dealerkit-reservation-final-safety.mjs'
      - 'scripts/apply-dealerkit-missing-wix*.mjs'
      - 'tests/dealerkit-reservation-final-safety-post-transform.test.js'
      - 'pages/VanscoStockWatchPage.jsx'
      - 'public/shared/sidebar-navigation.js'
      - 'App.jsx'
      - '.github/workflows/dealerkit-wix-safety.yml'

permissions:
  contents: read

jobs:
  dealerkit-wix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Stock Watch reservation routing regression
        run: |
          node scripts/apply-dealerkit-reservation-safety-fix.mjs
          node scripts/apply-finance-reserved-wix-stock-watch.mjs
          node scripts/apply-car-reserved-wix-stock-watch.mjs
          node scripts/apply-rent2buy-reserved-wix-stock-watch.mjs
          node scripts/apply-rent2buy-legacy-draft-stability.mjs
          node scripts/apply-wix-authoritative-stock-presence.mjs
          node scripts/apply-vansco-stock-watch-followups.mjs
          node scripts/apply-stock-watch-monitor-agent.mjs
          node scripts/apply-stock-watch-monitor-cron-auth.mjs
          node scripts/apply-dealerkit-live-stock-truth-fix.mjs
          node scripts/apply-dealerkit-vfc-copy-spec-fix.mjs
          node scripts/apply-dealerkit-price-difference-expansion.mjs
          node scripts/apply-dealerkit-readiness-monitor-fix.mjs
          node scripts/apply-dealerkit-photo-ready-workflow-fix.mjs
          node scripts/apply-dealerkit-reservation-final-safety.mjs
          node scripts/apply-dealerkit-missing-wix-hide-suppression.mjs
          node --test tests/dealerkit-reservation-final-safety-post-transform.test.js
      - name: Run DealerKit Wix safety tests
        run: node --test tests/dealerkit-wix-*.test.js
      - name: Build
        run: npm run build
