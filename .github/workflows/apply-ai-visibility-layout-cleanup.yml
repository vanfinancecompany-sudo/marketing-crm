name: Apply AI Visibility layout cleanup

on:
  push:
    branches:
      - ui/ai-visibility-layout-pagination
    paths:
      - .github/workflows/apply-ai-visibility-layout-cleanup.yml
      - scripts/apply_ai_visibility_layout_cleanup.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/ai-visibility-layout-pagination
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply UI-only changes
        run: python scripts/apply_ai_visibility_layout_cleanup.py
      - name: Format changed files
        run: npx --yes prettier@3.3.3 --write pages/AIVisibilityPage.jsx components/AIVisibilityLiveConnections.jsx tests/ai-visibility-layout-pagination.test.js
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: node --test tests/ai-visibility-layout-pagination.test.js tests/ai-visibility-live-connections.test.js tests/ai-visibility-manual-workflow.test.js
      - name: Run production build
        run: npm run build
      - name: Commit verified UI changes
        run: |
          rm .github/workflows/apply-ai-visibility-layout-cleanup.yml
          rm scripts/apply_ai_visibility_layout_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorder AI Visibility and paginate article results"
          git push origin HEAD:ui/ai-visibility-layout-pagination
