    branches:
      - ops/rent2buy-link-retrofit-20260814
    paths:
      - .github/workflows/rent2buy-link-retrofit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download final Wix export
        env:
          SOURCE_URL: "https://wix-data-exported-data.s3.amazonaws.com/tmp-uploads-2026-08/tf-1786705200-5821091740464153922.csv?response-content-disposition=attachment%3B%20filename%3D%22rent2buy_post_retrofit_verification.csv%22%3B%20filename%2A%3D%20UTF-8%27%27rent2buy-post-retrofit-verification.csv%3B&X-Amz-Security-Token=IQoJb3JpZ2luX2VjEDMaCXVzLWVhc3QtMSJHMEUCIQDAK9NbOJryl9CXKPJXAfEunX9uuW2YgwEBbmmsFSynGwIgUxURII2PDkXgaaP5SYccw4FICZ%2B27b7NDI6y7nYwfpIqogUI%2B%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2FARAFGgw0MTUyMDg3NTY1NjEiDCi6CSjuqsgNzdQEuCr2BFSBPVcgXSe4rZVubgNtJ3Vz8MoZw6EXfOblyz5kP%2BOdHEUjzPABTp%2BAX%2Bjpp8decgPH75A%2B3HcfDDK3p3rVBeq%2Fy9rvp%2B5sPc0lTay27vgms4RkpySqs3JdOqO8HXEvnE9S5eW5s%2F9Ev64KBsEeRXp4cWzik%2FHYY9R4zbfIlGotJuorc9V%2BYrsr8frs%2BWF5XxvMx9rLVzlMIxyEFGqGkVt8tl3uEr08AF4PfHBLUEiuYyKSnNfdFg7yfFSHBWPx4PGD8Fp7Sozk%2BBLOevSAY05%2FWGTyz%2FAqpC1C17Yjsd%2BBDs6ql0tNfO4mPm6s25PkVqU7KD8GQiBGTXHps8O6DdSZ0a8BXNioas0ZypHj8%2Fx8Hr1azU8smXuU7NY%2BnZfHA%2FQ%2FBDVFJT15EHlGAzbTck9sHJ6v0qEgKppFYSI%2BQ4JbkHPYo%2BleEZ9zHRnu%2BNUf18C64z2Lq3mLpTFVILbt7Qcf9JxbqD1weY4QK4oC0u0rKQzLcwh%2F55iRc348EiQcRRQ9boMIQXp2IHEMvPmNUsD4PSjHutKfo4I%2Fp%2F%2FNd3o7aWVC00xar4I97bvsItbrunOuNYa2vAO8K0M0jfaS8sTysyMIDY5BUPRx7QHcAJUO4Ky3yLT4klgKZZ5HBzpRpxiFNN0VAKcPXwIAU1oZhVVqkbFo95VFhGdWdsyqOPg4Fou4kBFzrSW0M8Ek2BaO7NUfKMVRSGdkPuPWyLyKWXwRft2zRhyBysXJvpd4HRxVJPfWX2TWF7wZBxlKmrVHuY6F%2Ba%2BMZmcm%2FULOWpsFuu6c101l8u2jQXuwPDkkC6WxIHgE1x6akDkDVRWFwu1bBfIhdirFyjD00fvTBjqZAcEWkspl0bo9xLTBKFNaSXkI8lQtBtDr1gDwxiY3Msx3t9a1TIoWnGAl0NFmdMUDu4ddo4186ZctykJ7jPwXLARR1s003fjZeanhY4KUkghI4qFTuY9jxQ%2Bylv1MV%2Fd8yd7Hw1Th6G%2FgZQVMYhCWG2%2BdRKNXqmg9YWmaptNNHP1gCy7TM%2BTRRrN638hxHxjyqa%2Fkds8amZMoHg%3D%3D&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20260814T110007Z&X-Amz-SignedHeaders=host&X-Amz-Credential=ASIAWBLC62VIXNRFIBXU%2F20260814%2Fus-east-1%2Fs3%2Faws4_request&X-Amz-Expires=86400&X-Amz-Signature=522bfa00a4851df225f8f5b1a0a900da2458e4805e2286d3e2f607045d5fd698"
        run: |
          curl --fail --location "$SOURCE_URL" --output final.csv
      - name: Audit all 52 CMS articles
        id: audit
        run: |
          python - <<'PY'
          import csv,json,collections,os
          COMMERCIAL={"/apply-for-no-credit-check-rent2buy-vans","/view-all-vans","/what-is-rent2buy-vans"}
          with open('final.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==52, len(rows)
          slugs={r['slug'] for r in rows}
          stats=collections.Counter()
          article_rows=[]
          def txt(n):
              if not isinstance(n,dict): return ''
              out=[]
              def w(x):
                  if isinstance(x,dict):
                      td=x.get('textData')
                      if isinstance(td,dict): out.append(td.get('text',''))
                      for c in x.get('nodes',[]) or []: w(c)
              w(n); return ''.join(out)
          for r in rows:
              doc=json.loads(r['content']); all_links=[]; generated_body_ids=set(); generated_old_ids=set(); body_ids=set(); section='preamble'
              for top in doc.get('nodes',[]) or []:
                  if isinstance(top,dict) and top.get('type')=='HEADING':
                      h=txt(top).strip().lower()
                      if h=='article body' or h.startswith('article body'): section='body'; continue
                      if 'frequently asked questions' in h: section='faq'; continue
                  def walk(n,sec):
                      if not isinstance(n,dict): return
                      nid=n.get('id','')
                      if sec in ('body','faq'): body_ids.add(nid)
                      td=n.get('textData')
                      if isinstance(td,dict):
                          for d in td.get('decorations',[]) or []:
                              if d.get('type')=='LINK':
                                  u=(((d.get('linkData') or {}).get('link') or {}).get('url'))
                                  if u: all_links.append((td.get('text',''),u,nid,sec))
                                  if '-r2bbody' in nid: generated_body_ids.add(nid)
                                  elif '-r2b' in nid: generated_old_ids.add(nid)
                      for c in n.get('nodes',[]) or []: walk(c,sec)
                  walk(top,section)
              old=[x for x in all_links if 'vanfinancecompany.co.uk' in x[1]]
              selflinks=[x for x in all_links if x[1]==f"/knowledge-hub-articles/{r['slug']}"]
              bad=[x for x in all_links if x[1].startswith('/knowledge-hub-articles/') and x[1].rsplit('/',1)[-1] not in slugs]
              kh=[x for x in all_links if x[1].startswith('/knowledge-hub-articles/')]
              comm=[x for x in all_links if x[1] in COMMERCIAL]
              misplaced_generated=[x for x in all_links if '-r2bbody' in x[2] and x[3] not in ('body','faq')]
              stats['total_links']+=len(all_links); stats['kh_links']+=len(kh); stats['commercial_links']+=len(comm)
              stats['old_domain']+=len(old); stats['self_links']+=len(selflinks); stats['bad_targets']+=len(bad)
              stats['old_generated_links']+=len(generated_old_ids); stats['misplaced_generated']+=len(misplaced_generated)
              stats['generated_body_links']+=len(generated_body_ids)
              if kh: stats['articles_with_kh']+=1
              if comm: stats['articles_with_commercial']+=1
              if all_links: stats['articles_with_any']+=1
              article_rows.append((r['ID'],r['Title'],len(all_links),len(kh),len(comm)))
          assert stats['old_domain']==0, stats
          assert stats['self_links']==0, stats
          assert stats['bad_targets']==0, stats
          assert stats['old_generated_links']==0, stats
          assert stats['misplaced_generated']==0, stats
          assert stats['articles_with_kh']>=35, stats
          with open('post_audit.csv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['id','title','all_links','knowledge_hub_links','commercial_links']); w.writerows(article_rows)
          with open('post_audit_stats.json','w',encoding='utf-8') as f: json.dump(dict(stats),f,indent=2,sort_keys=True)
          print(dict(stats))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k in ['articles_with_any','articles_with_kh','articles_with_commercial','total_links','kh_links','commercial_links','generated_body_links','old_domain','self_links','bad_targets','old_generated_links','misplaced_generated']:
                  f.write(f"{k}={stats[k]}\n")
          PY
      - name: Save final audit proof
        uses: actions/upload-artifact@v4
        with:
          name: r2b-audit-any${{ steps.audit.outputs.articles_with_any }}-kharticles${{ steps.audit.outputs.articles_with_kh }}-khlinks${{ steps.audit.outputs.kh_links }}-commercial${{ steps.audit.outputs.commercial_links }}-old${{ steps.audit.outputs.old_domain }}-self${{ steps.audit.outputs.self_links }}-bad${{ steps.audit.outputs.bad_targets }}-misplaced${{ steps.audit.outputs.misplaced_generated }}
          path: |
            post_audit.csv
            post_audit_stats.json
          retention-days: 1
