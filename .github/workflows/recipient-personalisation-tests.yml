name: Recipient personalisation tests

on:
  push:
    branches: [fix/recipient-first-name-personalisation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/marketing-recipient-personalisation.test.js
      - run: node --test tests/internal-link-strategy.test.js tests/knowledge-article-website-index.test.js tests/internal-link-refresh-plan.test.js
      - run: node --test tests/wix-draft-publish-plugin-support.test.js tests/wix-knowledge-rich-content-links.test.js
      - run: node --test tests/jasmin-knowledge-links.test.js tests/historic-link-bulk-workflow.test.js

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
