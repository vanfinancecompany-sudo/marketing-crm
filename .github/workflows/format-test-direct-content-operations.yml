name: Format and verify direct Content Operations wiring

on:
  push:
    branches:
      - fix/content-operations-reel-knowledge-wiring
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'fix/content-operations-reel-knowledge-wiring' || github.ref_name == 'fix/content-operations-reel-knowledge-wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/content-operations-reel-knowledge-wiring
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore readable formatting
        run: |
          npx --yes prettier@3.3.3 --write \
            pages/YouTubeGeneratorPage.jsx \
            services/marketingDailyOperations.js \
            pages/DashboardPage.jsx \
            tests/content-operations-wiring.test.js

      - name: Install dependencies
        run: npm ci

      - name: Capture tests and build
        run: |
          set +e
          node --test tests/marketing-daily-operations.test.js tests/content-operations-wiring.test.js > direct-wiring-test-result.txt 2>&1
          TEST_STATUS=$?
          npm run build > direct-wiring-build-result.txt 2>&1
          BUILD_STATUS=$?
          printf 'test_status=%s\nbuild_status=%s\n' "$TEST_STATUS" "$BUILD_STATUS" > direct-wiring-status.txt
          exit 0

      - name: Commit formatting and results
        run: |
          rm .github/workflows/format-test-direct-content-operations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use direct download tracking for Content Operations"
          git push origin HEAD:fix/content-operations-reel-knowledge-wiring
