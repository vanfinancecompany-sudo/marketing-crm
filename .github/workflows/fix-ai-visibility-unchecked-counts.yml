name: Fix AI Visibility unchecked counts

on:
  push:
    branches:
      - ui/ai-visibility-layout-pagination
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/ai-visibility-layout-pagination
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply unchecked-count fix
        run: python scripts/fix_ai_visibility_unchecked_counts.py
      - name: Format changed files
        run: npx --yes prettier@3.3.3 --write lib/aiVisibility.js pages/AIVisibilityPage.jsx tests/ai-visibility-unchecked-counts.test.js
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: node --test tests/ai-visibility-unchecked-counts.test.js
      - name: Run production build
        run: npm run build
      - name: Commit verified changes
        run: |
          rm .github/workflows/fix-ai-visibility-unchecked-counts.yml
          rm scripts/fix_ai_visibility_unchecked_counts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix unchecked article counts in AI Visibility"
          git push origin HEAD:ui/ai-visibility-layout-pagination
