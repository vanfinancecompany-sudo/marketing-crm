name: DealerKit Stock Watch live source

on:
  pull_request:
    paths:
      - 'api/dealerkit-stock-watch-legacy-*.js'
      - 'api/dealerkit-stock-watch-list.js'
      - 'tests/dealerkit-stock-watch-live-source.test.js'
      - 'vercel.json'
      - '.github/workflows/dealerkit-stock-watch-live-source.yml'

permissions:
  contents: read

jobs:
  stock-watch-live-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run DealerKit live-source regression tests
        run: node --test tests/dealerkit-stock-watch-live-source.test.js
      - name: Build from clean checkout
        id: build
        continue-on-error: true
        run: |
          set +e
          npm run build > dealerkit-build.log 2>&1
          code=$?
          cat dealerkit-build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload DealerKit build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealerkit-build-log
          path: dealerkit-build.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
